const STORE = "math-shared-stage2-box-vote";
const DISCUSS = "needs-discussion";
const courses = DATA.courses;
const courseName = Object.fromEntries(courses.map(c => [c.key, c.name]));

let votes = {};
try { votes = JSON.parse(localStorage.getItem(STORE) || "{}") || {}; } catch (e) { votes = {}; }
function persist() { try { localStorage.setItem(STORE, JSON.stringify(votes)); } catch (e) {} }

const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
};

const full = DATA.items.filter(i => Object.keys(i.versions).length === courses.length);
const partial = DATA.items.filter(i => Object.keys(i.versions).length < courses.length);
const ordered = [...full, ...partial];

function groupSummary(item) {
  const keys = Object.keys(item.versions);
  if (item.groups === 1) {
    return el("span", { class: "pill same", text: keys.length === courses.length
      ? "Same code in all four once colors are set aside"
      : "Same code everywhere it exists, colors aside" });
  }
  const byGroup = {};
  for (const k of keys) (byGroup[item.versions[k].group] ??= []).push(courseName[k]);
  const text = Object.values(byGroup).map(g => g.join(" = ")).join("  ·  ");
  return el("span", { class: "pill diff", text: item.groups + " code variants: " + text });
}

function colorsUsed(courseKey, source) {
  const palette = courses.find(c => c.key === courseKey).colors;
  const found = Object.keys(palette).filter(n => new RegExp("(^|[^A-Za-z@\\\\])" + n + "(?![A-Za-z@])").test(source));
  if (!found.length) return null;
  const s = el("div", { class: "colors" }, "Own colors: ");
  found.forEach((n, i) => { if (i) s.append(", "); s.append(el("code", { text: n })); });
  return s;
}

function render() {
  const intro = document.getElementById("intro");
  intro.append(
    el("p", { text: "Each section shows one environment from the four courses' -boxes.sty files, rendered from the same sample with each course's own article, boxes and key packages. Every course color is swapped for one neutral palette (frames dark gray, fills pale gray, answer ink red), so what differs on screen is structure: titles, spacing, rules and features. Under each picture, “Own colors” lists the course colors that definition uses, since the palette swap hides which role a box takes (vocabbox in navy versus green, for example)." }),
    el("p", { text: "The green or amber tag compares the definitions themselves after setting aside comments, colors and each course's internal prefix. Pick one version per environment, or “Needs discussion”. Choices are kept in this browser; download votes.json when you're done." }),
    el("p", { text: "Rendered from " + courses.map(c => c.name + " @ " + c.rev).join(", ") + "." }),
  );
  const main = document.getElementById("main");
  const nav = document.getElementById("nav");
  nav.append(el("h2", { text: "In all four courses" }));
  let dividerDone = false;
  for (const item of ordered) {
    const isPartial = Object.keys(item.versions).length < courses.length;
    if (isPartial && !dividerDone) {
      dividerDone = true;
      nav.append(el("h2", { text: "In only some courses" }));
      main.append(el("div", { class: "divider" },
        el("h2", { text: "In only some courses" }),
        el("p", { text: "These are defined in some of the -boxes.sty files but not all. The choices are the versions that exist, or “Needs discussion” (for example, to drop the environment or to leave it course-specific)." })));
    }
    nav.append(el("a", { href: "#" + item.id, id: "nav-" + item.id },
      item.id, el("span", { class: "st", id: "st-" + item.id })));

    const sec = el("section", { class: "item", id: item.id });
    sec.append(el("h3", { text: (item.kind === "cmd" ? "\\" : "") + item.id }));
    const meta = el("div", { class: "meta" });
    meta.append(el("span", { class: "pill", text: item.kind === "cmd" ? "command" : "environment" }));
    meta.append(groupSummary(item));
    if (item.defs.length > 1)
      meta.append(el("span", { text: "compared together with " + item.defs.slice(1).map(d => d === "teachernotestyle" ? d : "\\" + d).join(", ") }));
    if (isPartial)
      meta.append(el("span", { text: "defined in " + Object.keys(item.versions).map(k => courseName[k]).join(", ") }));
    sec.append(meta);

    const grid = el("div", { class: "grid" });
    for (const c of courses) {
      const v = item.versions[c.key];
      if (!v) {
        grid.append(el("div", { class: "card absent", "data-course": c.key },
          el("strong", { text: c.name }), el("span", { text: "Not defined in " + c.prefix + "-boxes.sty" })));
        continue;
      }
      const card = el("div", { class: "card", "data-course": c.key });
      const radio = el("input", { type: "radio", name: "pick-" + item.id, value: c.key });
      card.append(el("div", { class: "top" },
        el("label", { class: "pick" }, radio, el("strong", { text: c.name })),
        item.groups > 1 ? el("span", { class: "variant v" + v.group, text: "variant " + "ABCD"[v.group] }) : null));
      if (v.img) {
        card.append(el("a", { class: "shot", href: v.img, target: "_blank", title: "Open full size" },
          el("img", { src: v.img, alt: item.id + " rendered by " + c.prefix + "-boxes", loading: "lazy", width: v.w, height: v.h })));
        if (v.pages > 1) card.append(el("div", { class: "err", text: "The sample ran to " + v.pages + " pages; only page 1 is shown." }));
      } else if (item.rendered) {
        card.append(el("div", { class: "err", text: "Did not compile: " + (v.error || "unknown error") }));
      } else {
        card.append(el("div", { class: "nosample", text: "Nothing to draw: this command only changes page breaking. Compare the source." }));
      }
      const cu = colorsUsed(c.key, v.source);
      if (cu) card.append(cu);
      const det = el("details", {}, el("summary", { text: "Source in " + c.prefix + "-boxes.sty (comments removed)" }),
        el("pre", { text: v.source }));
      card.append(det);
      grid.append(card);
    }
    sec.append(grid);

    const discRadio = el("input", { type: "radio", name: "pick-" + item.id, value: DISCUSS });
    const note = el("textarea", { placeholder: "Note (optional): what to keep from the other versions, or what to discuss", "aria-label": "Note for " + item.id });
    sec.append(el("div", { class: "decide" },
      el("label", { class: "pick disc" }, discRadio, "Needs discussion"), note));

    sec.addEventListener("change", e => {
      if (e.target.type !== "radio") return;
      votes[item.id] = { ...(votes[item.id] || {}), choice: e.target.value };
      persist(); refresh(item.id);
    });
    note.addEventListener("input", () => {
      votes[item.id] = { ...(votes[item.id] || {}), note: note.value };
      if (!votes[item.id].choice && !note.value) delete votes[item.id];
      persist();
    });
    main.append(sec);
  }
  refreshAll();
}

function refresh(id) {
  const v = votes[id] || {};
  const sec = document.getElementById(id);
  sec.querySelectorAll("input[type=radio]").forEach(r => { r.checked = r.value === v.choice; });
  sec.querySelector("textarea").value = v.note || "";
  sec.querySelectorAll(".card").forEach(c => c.classList.toggle("chosen", c.dataset.course === v.choice));
  const st = document.getElementById("st-" + id);
  st.className = "st" + (v.choice === DISCUSS ? " disc" : v.choice ? " done" : "");
  st.textContent = v.choice === DISCUSS ? "discuss" : v.choice ? courseName[v.choice] : "";
  const done = ordered.filter(i => votes[i.id] && votes[i.id].choice).length;
  document.getElementById("progress").textContent = done + " of " + ordered.length + " decided";
}
function refreshAll() { ordered.forEach(i => refresh(i.id)); }

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2200);
}

document.getElementById("save").addEventListener("click", () => {
  const out = {
    stage: "2: box environments",
    saved: new Date().toISOString(),
    sources: Object.fromEntries(courses.map(c => [c.key, c.rev])),
    choices: "a course key from sources, or \"" + DISCUSS + "\"",
    votes: Object.fromEntries(ordered.filter(i => votes[i.id]).map(i => [i.id, {
      choice: votes[i.id].choice || null,
      ...(votes[i.id].note ? { note: votes[i.id].note } : {}),
      defined_in: Object.keys(i.versions),
    }])),
    undecided: ordered.filter(i => !(votes[i.id] && votes[i.id].choice)).map(i => i.id),
  };
  const blob = new Blob([JSON.stringify(out, null, 2) + "\n"], { type: "application/json" });
  const a = el("a", { href: URL.createObjectURL(blob), download: "votes.json" });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(out.undecided.length ? "Saved. " + out.undecided.length + " still undecided." : "Saved all choices.");
});

const LAYOUT = STORE + "-layout";
function setLayout(stacked) {
  document.body.classList.toggle("stacked", stacked);
  document.getElementById("layout").textContent = stacked ? "2 × 2 grid" : "Stacked";
  try { localStorage.setItem(LAYOUT, stacked ? "stacked" : "grid"); } catch (e) {}
}
document.getElementById("layout").addEventListener("click", () => setLayout(!document.body.classList.contains("stacked")));
try { setLayout(localStorage.getItem(LAYOUT) === "stacked"); } catch (e) {}

document.getElementById("load").addEventListener("click", () => document.getElementById("file").click());
document.getElementById("file").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const parsed = JSON.parse(await f.text());
    const ids = new Set(ordered.map(i => i.id));
    const next = {};
    for (const [id, v] of Object.entries(parsed.votes || {})) {
      if (!ids.has(id)) continue;
      next[id] = {};
      if (v.choice) next[id].choice = v.choice;
      if (v.note) next[id].note = v.note;
    }
    votes = next; persist(); refreshAll();
    toast("Loaded " + Object.keys(next).length + " entries.");
  } catch (err) { toast("Couldn't read that file: " + err.message); }
  e.target.value = "";
});

render();
</script>
</body>
</html>
